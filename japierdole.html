<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>WINDOWS XP - LEGIT TOTALNY</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            font-family: "Tahoma", sans-serif;
            overflow: hidden;
        }

        /* --- BOOT SEQUENCE --- */
        #boot {
            background: #000; color: #fff;
            font-family: monospace; padding: 20px;
            height: 100vh; display: block; z-index: 30000;
            position: relative;
        }

        /* --- DESKTOP --- */
        #desktop {
            display: none;
            width: 100vw; height: 100vh;
            background: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png');
            background-size: cover;
            position: relative;
            z-index: 1;
        }

        /* --- IKONKA (NA WIERZCHU) --- */
        #icon-exe {
            width: 80px;
            position: absolute;
            top: 50px; left: 50px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            z-index: 20000; /* NA SAMEJ GÓRZE */
        }
        #icon-exe img { width: 50px; display: block; margin: 0 auto; pointer-events: none; }
        #icon-exe span { color: white; background: rgba(0,0,80,0.6); font-size: 12px; padding: 2px; }

        /* --- OKNA (TEŻ NA WIERZCHU) --- */
        .window {
            position: absolute;
            background: #ece9d8;
            border: 3px solid #0054e3;
            border-top-left-radius: 8px; border-top-right-radius: 8px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 15000;
        }
        .win-title {
            background: linear-gradient(to right, #0054e3, #27c1ff);
            color: white; padding: 5px 10px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }

        #player-win { top: 20%; left: 30%; width: 400px; }
        #terminal-win { bottom: 50px; left: 50px; width: 450px; background: #000; border: 2px solid #ccc; }

        /* --- CHAOS (POD IKONAMI) --- */
        #chaos-overlay {
            display: none; 
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; 
            z-index: 500; /* POD IKONĄ I OKNAMI */
            pointer-events: none;
        }
        #spinning-img { 
            position: absolute; top: 50%; left: 50%; 
            width: 400px; transform: translate(-50%, -50%); 
        }

        .active-spin { animation: spin 0.1s linear infinite; }
        @keyframes spin { 
            0% { transform: translate(-50%, -50%) rotate(0deg) scale(2.5); filter: hue-rotate(0deg) invert(0%); }
            100% { transform: translate(-50%, -50%) rotate(360deg) scale(5); filter: hue-rotate(360deg) invert(100%); }
        }
        
        .shake { animation: shake 0.05s infinite; }
        @keyframes shake { 
            0% { transform: translate(5px,5px); } 
            50% { transform: translate(-8px,-5px); } 
            100% { transform: translate(5px,5px); } 
        }

        /* --- FINAL BLACK SCREEN --- */
        #bios-error {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: black; color: white;
            font-family: monospace; padding: 40px;
            z-index: 100000; /* TOTALNIE NA WIERZCHU NA KONIEC */
        }
    </style>
</head>
<body>

    <div id="boot"></div>

    <div id="desktop">
        <div id="icon-exe">
            <img src="eee.png" alt="exe">
            <span>szkoki.exe</span>
        </div>

        <div id="player-win" class="window">
            <div class="win-title"><span>Windows Media Player</span><span>✕</span></div>
            <div style="background:#000; height:250px; display:flex; align-items:center; justify-content:center;">
                <img src="eee.png" style="width:100px; opacity:0.3;">
            </div>
        </div>

        <div id="terminal-win" class="window">
            <div class="win-title" style="background:#444;"><span>C:\WINDOWS\system32\KYS.bat</span><span>✕</span></div>
            <div id="term-body" style="padding:10px; color:#0f0; font-family:monospace; height:180px; background:#000;"></div>
        </div>
    </div>

    <div id="chaos-overlay"><img src="eee.png" id="spinning-img"></div>
    
    <div id="bios-error">
        <p>Award BootBlock BIOS v1.0</p>
        <p>Copyright (C) 2026, Award Software, Inc.</p>
        <br>
        <p>BIOS ROM checksum error</p>
        <p>Detecting IDE ATAPI device...</p>
        <p>Found CDROM, trying to boot from it... Fail</p>
        <br>
        <p style="font-weight: bold; font-size: 22px; color: red;">DISK BOOT FAILURE, INSERT SYSTEM DISK AND PRESS ENTER</p>
        <span id="cursor">_</span>
    </div>

    <audio id="audio" src="eee.mp3" loop></audio>

    <script>
        // --- BOOT ---
        const boot = document.getElementById('boot');
        const bootLines = ["Memory Test: 128MB OK", "CPU: AMD Athlon(tm) 64 Processor 3000+", "IDE Channel 0 Master: Disk 80GB", "Verifying DMI Pool Data...", "Booting Windows XP..."];
        let bIdx = 0;
        function runBoot() {
            if (bIdx < bootLines.length) { boot.innerHTML += bootLines[bIdx++] + "<br>"; setTimeout(runBoot, 300); }
            else { setTimeout(() => { boot.style.display = 'none'; document.getElementById('desktop').style.display = 'block'; }, 800); }
        }
        runBoot();

        // --- DRAG SYSTEM ---
        const icon = document.getElementById('icon-exe');
        let isDragging = false, offset = { x: 0, y: 0 };

        icon.addEventListener('mousedown', (e) => {
            isDragging = true;
            offset.x = e.clientX - icon.offsetLeft;
            offset.y = e.clientY - icon.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            icon.style.left = (e.clientX - offset.x) + 'px';
            icon.style.top = (e.clientY - offset.y) + 'px';
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        // --- START ZADYMY ---
        icon.ondblclick = () => {
            document.getElementById('player-win').style.display = 'block';
            document.getElementById('audio').play();
            setTimeout(() => {
                document.getElementById('terminal-win').style.display = 'block';
                startKys();
            }, 2000);
        };

        function startKys() {
            const term = document.getElementById('term-body');
            const script = [
                "C:\\> echo OFF",
                "C:\\> del C:\\WINDOWS\\system32\\*.* /q",
                "Deleting System32... DONE",
                "C:\\> format C: /autotest",
                "FATAL ERROR: Disk corrupted.",
                "C:\\> KYS.exe --force"
            ];
            let sIdx = 0;
            const t = setInterval(() => {
                if (sIdx < script.length) {
                    term.innerHTML += script[sIdx++] + "<br>";
                } else {
                    clearInterval(t);
                    setTimeout(executeChaos, 500);
                }
            }, 500);
        }

        function executeChaos() {
            document.getElementById('chaos-overlay').style.display = 'block';
            document.getElementById('spinning-img').classList.add('active-spin');
            document.body.classList.add('shake');
            
            const strobo = setInterval(() => {
                document.body.style.backgroundColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            }, 40);

            setTimeout(() => {
                clearInterval(strobo);
                document.body.classList.remove('shake');
                document.getElementById('bios-error').style.display = 'block';
                document.getElementById('audio').pause();
                setInterval(() => {
                    const c = document.getElementById('cursor');
                    c.style.opacity = c.style.opacity == "0" ? "1" : "0";
                }, 500);
            }, 7000); // 7 sekund rzeźni
        }
    </script>
</body>
</html>
