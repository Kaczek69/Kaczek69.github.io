<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Czytacz Tekstu 2.0 🔊</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --card: #1c1c1c;
      --accent: #0af;
      --accent-hover: #08c;
      --text: #eee;
      --font: 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      margin: 0;
      padding: 2em;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 1em;
      font-size: 2em;
      color: var(--accent);
      animation: fadeIn 1s ease-out;
    }

    .card {
      background: var(--card);
      padding: 2em;
      border-radius: 20px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 0 20px #0008;
      animation: slideUp 0.8s ease-out;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1em;
      font-size: 1.2em;
      border-radius: 12px;
      border: none;
      resize: none;
      background: #222;
      color: var(--text);
      margin-bottom: 1em;
    }

    label {
      display: block;
      margin: 0.5em 0 0.2em;
    }

    select, input[type="range"] {
      width: 100%;
      padding: 0.6em;
      border-radius: 8px;
      border: none;
      font-size: 1em;
      background: #2a2a2a;
      color: var(--text);
      margin-bottom: 1em;
    }

    button {
      width: 100%;
      padding: 1em;
      font-size: 1.2em;
      border: none;
      border-radius: 12px;
      background-color: var(--accent);
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #speedValue {
      display: inline-block;
      min-width: 2em;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🗣️ TTS</h1>
  <div class="card">
    <textarea id="tekst" placeholder="Halo halo tu Sosnowiec..."></textarea>

    <label for="voiceSelect">🎙 Głos:</label>
    <select id="voiceSelect"></select>

    <label for="speed">⏩ Prędkość: <span id="speedValue">1</span>x</label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

    <button onclick="czytaj()">🔊 GO</button>
  </div>

  <script>
    const voiceSelect = document.getElementById("voiceSelect");
    const speedInput = document.getElementById("speed");
    const speedValue = document.getElementById("speedValue");

    let voices = [];

    function updateVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = "";
      voices.forEach((voice, i) => {
        const option = document.createElement("option");
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
    }

    window.speechSynthesis.onvoiceschanged = updateVoices;
    updateVoices();

    speedInput.oninput = () => {
      speedValue.textContent = speedInput.value;
    };

    function czytaj() {
      const tekst = document.getElementById("tekst").value;
      if (!tekst.trim()) return;
      const msg = new SpeechSynthesisUtterance(tekst);
      const selectedVoice = voices[voiceSelect.value];
      if (selectedVoice) msg.voice = selectedVoice;
      msg.rate = parseFloat(speedInput.value);
      window.speechSynthesis.cancel(); // Stop previous
      window.speechSynthesis.speak(msg);
    }
  </script>
</body>
</html>
